[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devsearch"
version = "1.0.0"
description = "Search for coding answers from your terminal, focused on developer sites."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tommy Nguyen" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devsearch = "devsearch.cli:main"

[project.urls]
Homepage = "https://github.com/Gnomedealer/googleSearchInTerminalAutomation"

[tool.setuptools]
packages = ["devsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
